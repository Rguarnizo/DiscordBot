version: "3.8"

services:
  n8n:
    build: .
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - NODES_EXCLUDE=[]
      - TZ=Europe/Rome
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: